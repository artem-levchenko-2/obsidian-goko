<linearGradient id="b" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="168.5"><stop offset="0.0000" stop-color="#A68AF9"/><stop offset="0.3561" stop-color="#A68AF9"/><stop offset="0.3561" stop-color="#8A5CF5"/><stop offset="0.7122" stop-color="#8A5CF5"/><stop offset="0.7122" stop-color="#6A3FD0"/><stop offset="1.0000" stop-color="#6A3FD0"/></linearGradient>
<mask id="s" maskUnits="userSpaceOnUse" x="-20" y="-20" width="610" height="272"><use href="#w" transform="translate(10.5 14.5)" fill="none" stroke="#fff" stroke-width="7"/><use href="#w" transform="translate(10.5 14.5)" fill="none" stroke="#000" stroke-width="3"/></mask>
</defs>
<rect width="570" height="232" rx="16" fill="#1C1C1C"/>
<g transform="translate(42 34)">
